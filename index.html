<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 25px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            background: white;
            color: #764ba2;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        #message {
            margin-top: 25px;
            font-size: 1.1rem;
            min-height: 30px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>✨ Hello from AWS EC2!</h1>::
        <p>Welcome to my completely random website.</p> <button onclick="changeMessage()"> Click Me </button>
        <div id="message"></div>
    </div>
    <script> const messages = ["🚀 You clicked the button!", "🎉 Something happened!", "🦆 Quack. That is all.", "🌈 Have a great day!", "🔥 You found the secret button!", "🤖 Beep boop!", "🍕 Pizza would be nice right now.", "⭐ You're awesome!"]; function changeMessage() { const randomIndex = Math.floor(Math.random() * messages.length); document.getElementById("message").textContent = messages[randomIndex]; } </script>
</body>

</html>
